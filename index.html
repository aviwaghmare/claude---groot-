<!DOCTYPE html>
<!--
=====================================================================
 GROOT CHATBOT : FRONTEND (this single file)  ->  hosted on GitHub Pages
 BACKEND (backend/main.py)                    ->  hosted on Render
=====================================================================

 HOW THE TWO PARTS TALK
   Browser (this file, GitHub Pages)  --POST /chat {message}-->  Render (FastAPI)
   Browser  <--{answer, score, ...} JSON--                       Render
   The ONLY link between them is the API_URL constant in the <script> below.

 FOLDER STRUCTURE (one GitHub repo, e.g. "groot-chatbot")
   groot-chatbot/
     index.html            <- this file (must be at the repo root for Pages)
     render.yaml           <- optional, Render blueprint
     backend/
       main.py  data.json  requirements.txt

 STEP 1: PUT THE CODE ON GITHUB
   1. github.com -> New repository -> name "groot-chatbot" -> Public -> Create.
   2. Upload all files keeping the folder structure
      (Add file -> Upload files, or use git: git add . && git commit && git push).

 STEP 2: DEPLOY THE BACKEND ON RENDER (do this BEFORE the frontend)
   1. render.com -> sign in with GitHub -> New + -> Web Service.
   2. Pick your "groot-chatbot" repo.
   3. Fill in:
        Root Directory : backend
        Runtime        : Python 3
        Build Command  : pip install -r requirements.txt
        Start Command  : uvicorn main:app --host 0.0.0.0 --port $PORT
        Instance type  : Free
   4. Environment variables (optional): MIN_SCORE=50, ALLOWED_ORIGINS=*
   5. Create Web Service. Wait for "Your service is live".
   6. Copy the URL at the top, e.g. https://groot-chatbot-api.onrender.com
   7. Test it: open <that URL>/health in the browser. You should see {"status":"awake",...}
      Interactive docs to try questions: <that URL>/docs

 STEP 3: CONNECT THE FRONTEND TO THE BACKEND
   Replace the API_URL below with your Render URL (no slash at the end!).
   Commit the change.

 STEP 4: PUBLISH THE FRONTEND ON GITHUB PAGES
   1. Repo -> Settings -> Pages.
   2. Source: "Deploy from a branch" -> Branch: main, Folder: /(root) -> Save.
   3. After ~1 minute your site is live at
        https://YOUR-USERNAME.github.io/groot-chatbot/

 STEP 5: LOCK DOWN CORS (recommended)
   In Render -> your service -> Environment, set
        ALLOWED_ORIGINS = https://YOUR-USERNAME.github.io
   (only the domain, no /groot-chatbot path). Render redeploys automatically.
   If the chat shows a network error, a wrong ALLOWED_ORIGINS is the #1 cause.

 GOOD TO KNOW
   * Free Render servers sleep after ~15 minutes. The first request can take
     30-60 seconds. This page pings /health when it opens to wake it early.
   * To teach Groot new things: edit backend/data.json, commit, and Render
     redeploys. Questions he could not answer appear in Render -> Logs as
     "UNANSWERED: ...", a ready to-do list for new data.
   * Change how strict matching is with MIN_SCORE (45 = lenient, 70 = strict).
   * Test locally: run the backend (uvicorn main:app --reload), then set
     API_URL = "http://127.0.0.1:8000" and open this file in the browser.
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Groot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#7fa63a; --leaf-deep:#4f6f23; --sprout:#c9e07a; --bark:#4a3324; --bark-soft:#6b4c36;
  --mist:#f4f8e8; --dew:#e3eed0; --glow:#f6c945; --ink:#2b2118; --rose:#e8896b;
  --display:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,#fffbe0 0,transparent 35%),
    radial-gradient(circle at 90% 90%,#cfe3a6 0,transparent 45%),
    linear-gradient(160deg,var(--dew),#d3e6b4);
  display:grid;place-items:center;padding:16px;
}
.app{
  width:min(760px,100%);height:min(860px,calc(100dvh - 32px));
  background:var(--mist);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 70px -25px rgba(61,86,24,.55),0 0 0 6px rgba(255,255,255,.55);
}
header{
  background:var(--bark);color:var(--mist);padding:18px 22px;display:flex;gap:16px;align-items:center;
  border-bottom:6px solid var(--leaf);
}
.avatar{width:76px;height:76px;flex:none;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.avatar .eye{transform-origin:center;animation:blink 6s infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
h1{font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1}
.sub{font-size:.95rem;opacity:.85;margin-top:4px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;
  background:rgba(255,255,255,.12);padding:7px 13px;border-radius:99px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 0 var(--glow);animation:pulse 1.6s infinite}
.status.ok .dot{background:var(--sprout);animation:none;box-shadow:0 0 10px var(--sprout)}
.status.bad .dot{background:var(--rose);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
#log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:84%;padding:12px 16px;border-radius:22px;line-height:1.5;font-size:1.02rem;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--leaf);color:#fff;font-weight:600;border-bottom-right-radius:6px}
.groot{align-self:flex-start;background:#fff;border:2px solid var(--dew);border-bottom-left-radius:6px}
.voice{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--leaf-deep);margin-bottom:6px}
.tr{padding:10px 12px;background:var(--mist);border-radius:14px;border-left:5px solid var(--glow)}
.tr b{display:block;font-size:.78rem;color:var(--bark-soft);margin-bottom:2px}
.meta{margin-top:8px;font-size:.8rem;color:var(--bark-soft);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.seed{display:inline-block;width:70px;height:7px;border-radius:9px;background:var(--dew);vertical-align:middle;margin-left:6px;overflow:hidden}
.seed i{display:block;height:100%;background:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--leaf);background:#fff;color:var(--leaf-deep);font:700 .88rem var(--body);
  padding:7px 13px;border-radius:99px;cursor:pointer;transition:background .15s,transform .15s}
.chip:hover{background:var(--sprout);transform:translateY(-2px)}
.typing{display:flex;gap:6px;padding:16px 18px}
.typing span{width:12px;height:12px;background:var(--leaf);border-radius:2px 100% 2px 100%;animation:bob 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-7px) rotate(25deg)}}
form{display:flex;gap:10px;padding:14px 18px 18px;background:var(--mist);border-top:2px solid var(--dew)}
input{flex:1;min-width:0;font:600 1rem var(--body);padding:14px 18px;border-radius:99px;border:2px solid var(--dew);background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--sprout);border-color:var(--leaf)}
button.send{font:800 1rem var(--display);background:var(--bark);color:var(--mist);border:0;border-radius:99px;padding:0 26px;cursor:pointer;transition:background .15s}
button.send:hover{background:var(--leaf-deep)}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
@media (max-width:520px){
  body{padding:0}.app{height:100dvh;border-radius:0;box-shadow:none}
  .avatar{width:56px;height:56px}h1{font-size:1.5rem}.sub{display:none}.status{font-size:.75rem;padding:6px 10px}
  #log{padding:14px}.msg{max-width:92%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <svg class="avatar" viewBox="0 0 100 100" role="img" aria-label="Cartoon tree sprout face">
      <path d="M50 14c-4-12-20-12-22-4 8 0 15 2 22 4zM50 14c4-12 20-12 22-4-8 0-15 2-22 4z" fill="#9cc34a"/>
      <path d="M50 24v-10" stroke="#6f9a2d" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="24" width="64" height="66" rx="30" fill="#8a6244"/>
      <path d="M30 34c-3 8-3 16 0 24M70 40c3 6 3 12 0 18" stroke="#6b4c36" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g class="eye"><ellipse cx="38" cy="58" rx="7" ry="8" fill="#241811"/><circle cx="40" cy="55" r="2.5" fill="#fff"/></g>
      <g class="eye"><ellipse cx="62" cy="58" rx="7" ry="8" fill="#241811"/><circle cx="64" cy="55" r="2.5" fill="#fff"/></g>
      <path d="M43 74q7 6 14 0" stroke="#241811" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="70" r="5" fill="#e8896b" opacity=".45"/><circle cx="71" cy="70" r="5" fill="#e8896b" opacity=".45"/>
    </svg>
    <div>
      <h1>Groot</h1>
      <p class="sub">Ask about the Guardians. Rocket translates.</p>
    </div>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Waking up</span></div>
  </header>

  <section id="log" aria-live="polite"></section>

  <form id="form" autocomplete="off">
    <input id="input" maxlength="300" placeholder="Ask Groot something…" aria-label="Your question">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>

<script>
/* ------------------------------------------------------------------
   THE CONNECTION: paste your Render URL here (no slash at the end).
   Example: "https://groot-chatbot-api.onrender.com"
------------------------------------------------------------------ */
const API_URL = "https://groot-chatbot-api.onrender.com";

const $ = s => document.querySelector(s);
const log = $("#log"), form = $("#form"), input = $("#input"), send = $("#send");
const statusEl = $("#status"), statusText = $("#statusText");

const STARTERS = ["Who are the Guardians of the Galaxy?", "What are your powers?", "Who is Rocket?",
                  "What happened in Infinity War?", "What if you could speak?"];

function setStatus(kind, text){ statusEl.className = "status " + kind; statusText.textContent = text; }

function bubble(cls){
  const d = document.createElement("div"); d.className = "msg " + cls; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}
function el(tag, cls, text){
  const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e;
}
function chips(list){
  const wrap = el("div", "chips");
  list.forEach(q => { const b = el("button", "chip", q); b.type = "button"; b.onclick = () => ask(q); wrap.appendChild(b); });
  return wrap;
}

function grootSays(d){
  const b = bubble("groot");
  b.appendChild(el("div", "voice", d.matched ? "I am Groot." : "I am Groot?"));
  const tr = el("div", "tr"); tr.appendChild(el("b", "", "Rocket translates")); tr.appendChild(document.createTextNode(d.answer));
  b.appendChild(tr);
  const meta = el("div", "meta");
  if (d.matched && d.score < 100){
    const m = el("span", "", "Match " + d.score + "%");
    const bar = el("span", "seed"); const fill = el("i"); fill.style.width = d.score + "%"; bar.appendChild(fill); m.appendChild(bar);
    meta.appendChild(m);
  }
  if (d.understood_as) meta.appendChild(el("span", "", "Read as: “" + d.understood_as + "”"));
  if (meta.children.length) b.appendChild(meta);
  if (!d.matched && d.suggestions) b.appendChild(chips(d.suggestions));
  log.scrollTop = log.scrollHeight;
}

async function ask(text){
  text = text.trim(); if (!text) return;
  bubble("me").textContent = text; input.value = "";
  send.disabled = true;
  const t = bubble("groot"); t.classList.add("typing"); t.innerHTML = "<span></span><span></span><span></span>";
  try{
    const r = await fetch(API_URL + "/chat", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({message: text})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json(); t.remove(); grootSays(d); setStatus("ok", "Awake");
  }catch(err){
    t.remove(); setStatus("bad", "Offline");
    const b = bubble("groot");
    b.appendChild(el("div", "voice", "I am Groot…"));
    b.appendChild(el("div", "tr", "I can’t reach my roots (the server). If you just opened this page, wait about a minute and try again. Owner: check API_URL and ALLOWED_ORIGINS."));
  }finally{ send.disabled = false; input.focus(); }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });

// First message + wake up the free Render server in the background
(function start(){
  const b = bubble("groot");
  b.appendChild(el("div", "voice", "I am Groot!"));
  const tr = el("div", "tr"); tr.appendChild(el("b", "", "Rocket translates"));
  tr.appendChild(document.createTextNode("Hello, friend! Ask me about my story, my powers or the Guardians."));
  b.appendChild(tr); b.appendChild(chips(STARTERS));

  fetch(API_URL + "/health").then(r => r.ok ? setStatus("ok", "Awake") : Promise.reject())
    .catch(() => setStatus("bad", "Offline"));
})();
</script>
</body>
</html>
